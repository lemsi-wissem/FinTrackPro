spring:
  datasource:
    url: jdbc:h2:mem:fintrack_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  cors:
    allowed-origins: http://localhost:4200
  mail:
    from: noreply@fintrack.test
    verification-url: http://localhost:4200/auth/verify-email
