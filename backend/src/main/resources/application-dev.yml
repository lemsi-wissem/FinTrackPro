spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fintrack
    username: postgres
    password: Ronaldo@23
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025

app:
  jwt:
    secret: ${JWT_SECRET:fintrack-super-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  cors:
    allowed-origins: http://localhost:4200
  mail:
    from: noreply@fintrack.dev
    verification-url: http://localhost:4200/auth/verify-email
    password-reset-url: http://localhost:4200/auth/reset-password
  password-reset:
    token-ttl-seconds: 3600
